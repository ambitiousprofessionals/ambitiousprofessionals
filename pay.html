<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting to payment…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:'Inter',sans-serif;background:#FBF9F5;color:#2B2823;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center;}
  .box{max-width:420px;}
  h1{font-size:20px;margin-bottom:12px;}
  p{font-size:15px;color:#555;margin-bottom:20px;}
  a.btn{display:inline-block;padding:14px 28px;background:#AE1029;color:#fff;text-decoration:none;border-radius:6px;font-weight:600;}
  .hint{margin-top:24px;font-size:13px;color:#888;}
</style>
</head>
<body>
<div class="box">
  <h1>Opening your UPI app…</h1>
  <p>If nothing happens automatically, tap the button below.</p>
  <a class="btn" id="payBtn" href="#">Open UPI App</a>
  <p class="hint">On a laptop or desktop? UPI apps only work on phones — please scan the QR code from the email instead, using your phone's camera or UPI app.</p>
</div>
<script>
  // SECURITY: this page only ever opens a payment to OUR OWN UPI ID. A link that asks to pay anybody else is refused,
  // so nobody can misuse our website address to send customers' money to someone else.
  var OUR_UPI_ID = 'abanindrasahu@ybl';
  var params = new URLSearchParams(window.location.search);
  var upi = params.get('upi') || '';

  function isOurPaymentLink(link) {
    var m = /^upi:\/\/pay\?(.*)$/i.exec(link);
    if (!m) return false;
    var q = new URLSearchParams(m[1]);
    var payee = (q.get('pa') || '').toLowerCase();
    var currency = (q.get('cu') || 'INR').toUpperCase();
    var amount = q.get('am');
    return payee === OUR_UPI_ID && currency === 'INR' && (amount === null || /^\d{1,9}(\.\d{1,2})?$/.test(amount));
  }

  if (upi && isOurPaymentLink(upi)) {
    document.getElementById('payBtn').href = upi;
    // Attempt an automatic hand-off — this works on phones where a UPI app is
    // registered to handle the upi:// scheme. Nothing happens on desktop, which
    // is expected since there's no UPI app there.
    window.location.href = upi;
  } else if (upi) {
    document.querySelector('h1').textContent = 'This payment link is not valid';
    document.getElementById('payBtn').style.display = 'none';
    var hint = document.querySelector('.hint');
    if (hint) hint.textContent = 'For your safety, this page only opens payments to Ambitious Professionals. Please use the QR code or the Pay button from your own order e-mail, or contact us on +91 98531 70049.';
  }
</script>
</body>
</html>
